[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eegtumor"
version = "2.0.0"
description = "Reproducible qEEG biomarker extraction and subject-disjoint ML evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Soheil Kooklan" }]
keywords = ["EEG", "biomarkers", "machine-learning", "reproducibility", "qEEG"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3",
  "PyWavelets>=1.4", "PyYAML>=6.0", "matplotlib>=3.7",
]

[project.optional-dependencies]
edf = ["mne>=1.5"]
optim = ["optuna>=3.4", "statsmodels>=0.14"]
boosting = ["xgboost>=2.0", "lightgbm>=4.0"]
explain = ["shap>=0.44"]
gui = ["customtkinter>=5.2"]
dev = ["pytest>=7.4", "ruff>=0.4"]
all = ["mne>=1.5", "optuna>=3.4", "statsmodels>=0.14", "xgboost>=2.0",
       "lightgbm>=4.0", "shap>=0.44", "customtkinter>=5.2", "pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/soheilkooklan/Tumor-from-EEG"
Documentation = "https://github.com/soheilkooklan/Tumor-from-EEG/tree/main/docs"
Issues = "https://github.com/soheilkooklan/Tumor-from-EEG/issues"

[project.scripts]
eegtumor = "eegtumor.cli:main"

[tool.setuptools.packages.find]
include = ["eegtumor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
